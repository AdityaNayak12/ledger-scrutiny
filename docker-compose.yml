services:
  db:
    image: postgres:16-alpine
    container_name: ledger_scrutiny_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledger_scrutiny
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ledger_scrutiny_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ledger_scrutiny
      SECRET_KEY: ${SECRET_KEY:-local-demo-secret-change-before-deployment}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-demo-client-id}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      GST_LOOKUP_MODE: ${GST_LOOKUP_MODE:-demo}
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ledger_scrutiny_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    depends_on:
      - backend
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules

volumes:
  postgres_data:
